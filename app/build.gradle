plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}
android {
    namespace 'com.swararia.audiolab'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.swararia.audiolab.spike'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0-spike'
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['/META-INF/AL2.0','/META-INF/LGPL2.1','META-INF/DEPENDENCIES','META-INF/LICENSE.md','META-INF/NOTICE.md'] }
    }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    implementation 'io.github.deniscerri.youtubedl-android:library:0.19.0'
    implementation 'io.github.deniscerri.youtubedl-android:ffmpeg:0.19.0'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.20.1')
    implementation 'com.fasterxml.jackson.core:jackson-databind' // Already bundled transitively; direct use by search parser.
    constraints {
        implementation('commons-io:commons-io:2.20.0') { because 'Avoid the obsolete 2.5 transitive version from the downloader wrapper' }
    }
    testImplementation 'junit:junit:4.13.2'
}
